<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6E6E9"/>
      <stop offset="100%" stop-color="#F0CCD2"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFDF5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F6E6E9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <circle cx="300" cy="150" r="180" fill="url(#sunGlow)"/>
  
  <!-- Subtle rolling hills / landscape -->
  <path d="M 0 350 Q 150 300 300 330 T 600 320 L 600 450 L 0 450 Z" fill="#FBF3DE" opacity="0.4"/>
  <path d="M 0 380 Q 200 330 400 360 T 600 370 L 600 450 L 0 450 Z" fill="#FFF9EF" opacity="0.6"/>

  <!-- Little sunflowers on the hill -->
  <circle cx="80" cy="350" r="14" fill="#F4C95D"/>
  <circle cx="80" cy="350" r="6" fill="#755B4A"/>
  <circle cx="130" cy="370" r="18" fill="#F4C95D"/>
  <circle cx="130" cy="370" r="8" fill="#755B4A"/>
  <circle cx="500" cy="360" r="16" fill="#F4C95D"/>
  <circle cx="500" cy="360" r="7" fill="#755B4A"/>

  <!-- Centered Cute Icon -->
  <g transform="translate(300, 190) scale(1.3)">
    <circle cx="0" cy="0" r="42" fill="#FFF9EF" stroke="#F4C95D" stroke-width="3"/>
    <text x="0" y="10" text-anchor="middle" font-size="34">📚</text>
  </g>

  <!-- Typography -->
  <text x="300" y="275" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#755B4A">Quiet Focus</text>
  <text x="300" y="305" text-anchor="middle" font-family="'Nunito', sans-serif" font-size="15" fill="#8C705E">When you are lost in your passions</text>
  <text x="300" y="420" text-anchor="middle" font-family="'Caveat', cursive" font-size="18" fill="#B4937D">♡ click or tap in edit mode to replace with your photo ♡</text>
</svg>