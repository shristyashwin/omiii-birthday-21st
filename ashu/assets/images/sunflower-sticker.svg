    <!-- Center disk -->
    <circle cx="50" cy="50" r="16" fill="#755B4A"/>
    <circle cx="50" cy="50" r="13" fill="#5A3E2F"/>
    <!-- Seed texture -->
    <circle cx="47" cy="47" r="1.5" fill="#F4C95D"/>
    <circle cx="53" cy="46" r="1.5" fill="#F4C95D"/>
    <circle cx="50" cy="52" r="1.5" fill="#F4C95D"/>
