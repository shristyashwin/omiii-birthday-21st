<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="sealGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FCEAB3"/>
      <stop offset="70%" stop-color="#F4C95D"/>
      <stop offset="100%" stop-color="#DE9D26"/>
    </radialGradient>
    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#755B4A" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#stickerShadow)">
