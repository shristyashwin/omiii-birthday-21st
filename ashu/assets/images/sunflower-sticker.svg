      <ellipse cx="20" cy="50" rx="12" ry="4.5"/>
      <ellipse cx="80" cy="50" rx="12" ry="4.5"/>
      <ellipse cx="29" cy="29" rx="5" ry="12" transform="rotate(45 29 29)"/>
      <ellipse cx="71" cy="71" rx="5" ry="12" transform="rotate(45 71 71)"/>
      <ellipse cx="29" cy="71" rx="5" ry="12" transform="rotate(-45 29 71)"/>
      <ellipse cx="71" cy="29" rx="5" ry="12" transform="rotate(-45 71 29)"/>
    </g>
    <g fill="#FBD66A">
      <ellipse cx="50" cy="23" rx="3.5" ry="9"/>
      <ellipse cx="50" cy="77" rx="3.5" ry="9"/>
      <ellipse cx="23" cy="50" rx="9" ry="3.5"/>
