<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280">
  <defs>
    <filter id="cakeGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F4C8AD" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="frosting" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#FFF5E5"/>
    </linearGradient>
    <linearGradient id="blushLayer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9E2E6"/>
      <stop offset="100%" stop-color="#F2CBD3"/>
    </linearGradient>
    <radialGradient id="flameGrad" cx="50%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#FFF"/>
      <stop offset="35%" stop-color="#FFE770"/>
      <stop offset="70%" stop-color="#FF9D2E"/>
      <stop offset="100%" stop-color="#E2572C" stop-opacity="0.1"/>
    </radialGradient>
  </defs>

  <!-- Cake Stand / Plate -->
  <g filter="url(#cakeGlow)">
    <ellipse cx="150" cy="250" rx="120" ry="18" fill="#F8E7A1" stroke="#F4C95D" stroke-width="3"/>
    <path d="M 120 250 L 115 270 L 185 270 L 180 250 Z" fill="#F4C95D"/>
    <ellipse cx="150" cy="270" rx="35" ry="6" fill="#DE9D26"/>
  </g>

  <!-- Bottom Tier -->
  <g>
    <path d="M 50 180 Q 50 220 150 220 Q 250 220 250 180 L 250 140 Q 250 170 150 170 Q 50 170 50 140 Z" fill="url(#blushLayer)"/>
    <ellipse cx="150" cy="140" rx="100" ry="24" fill="url(#frosting)" stroke="#F8E7A1" stroke-width="2"/>
    
    <!-- Frosting drips -->
    <path d="M 50 140 Q 60 160 70 144 Q 85 168 100 144 Q 115 172 130 144 Q 145 165 160 144 Q 175 170 190 144 Q 205 162 220 144 Q 235 166 250 140 L 250 140 Z" fill="#FFFDF9"/>

    <!-- Strawberry decorations on bottom edge -->
    <circle cx="80" cy="180" r="5" fill="#E86C6C"/>
    <circle cx="120" cy="190" r="5" fill="#E86C6C"/>
    <circle cx="150" cy="195" r="5" fill="#E86C6C"/>
    <circle cx="180" cy="190" r="5" fill="#E86C6C"/>
    <circle cx="220" cy="180" r="5" fill="#E86C6C"/>
  </g>

  <!-- Top Tier -->
  <g>
    <path d="M 80 120 Q 80 150 150 150 Q 220 150 220 120 L 220 90 Q 220 115 150 115 Q 80 115 80 90 Z" fill="#FCE8B3"/>
    <ellipse cx="150" cy="90" rx="70" ry="18" fill="#FFFBF4" stroke="#F4C95D" stroke-width="2"/>
    
    <!-- Top cream drips -->
    <path d="M 80 90 Q 95 110 110 92 Q 130 114 150 92 Q 170 115 190 92 Q 205 108 220 90 Z" fill="#FFFDF9"/>
    
    <!-- Whipped Cream Dollops -->
    <circle cx="95" cy="85" r="8" fill="#FFF9EF" stroke="#FCEAB3"/>
    <circle cx="120" cy="95" r="8" fill="#FFF9EF" stroke="#FCEAB3"/>
    <circle cx="150" cy="100" r="9" fill="#FFF9EF" stroke="#FCEAB3"/>
    <circle cx="180" cy="95" r="8" fill="#FFF9EF" stroke="#FCEAB3"/>
    <circle cx="205" cy="85" r="8" fill="#FFF9EF" stroke="#FCEAB3"/>

    <!-- Strawberries on top -->
    <path d="M 95 78 Q 90 84 95 87 Q 100 84 95 78 Z" fill="#E86C6C"/>
    <path d="M 150 90 Q 144 98 150 102 Q 156 98 150 90 Z" fill="#E86C6C"/>
    <path d="M 205 78 Q 200 84 205 87 Q 210 84 205 78 Z" fill="#E86C6C"/>
  </g>

  <!-- Main 21 Candles -->
  <!-- Candle '2' -->
  <g class="cake-candle-21" id="candle-number-2">
    <rect x="130" y="45" width="8" height="35" rx="3" fill="#F4C8AD" stroke="#DE9D26" stroke-width="1"/>
    <!-- Wick -->
    <line x1="134" y1="45" x2="134" y2="38" stroke="#755B4A" stroke-width="2"/>
    <!-- Flame -->
    <ellipse class="candle-flame" cx="134" cy="30" rx="5" ry="9" fill="url(#flameGrad)"/>
  </g>

  <!-- Candle '1' -->
  <g class="cake-candle-21" id="candle-number-1">
    <rect x="162" y="45" width="8" height="35" rx="3" fill="#B7C9A5" stroke="#8EA47B" stroke-width="1"/>
    <!-- Wick -->
    <line x1="166" y1="45" x2="166" y2="38" stroke="#755B4A" stroke-width="2"/>
    <!-- Flame -->
    <ellipse class="candle-flame" cx="166" cy="30" rx="5" ry="9" fill="url(#flameGrad)"/>
  </g>

  <!-- Tiny celebratory sparklers / mini candles around top rim -->
  <circle cx="110" cy="78" r="2" fill="#F4C95D"/>
  <circle cx="190" cy="78" r="2" fill="#F4C95D"/>
  <circle cx="150" cy="74" r="2.5" fill="#F4C95D"/>
</svg>